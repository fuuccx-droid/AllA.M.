<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllA.M. - 음악 추천 서비스</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: #f0f8ff;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(135, 206, 235, 0.3);
            text-align: center;
        }

        header h1 {
            color: #0080ff;
            font-size: 2.2rem;
            margin-bottom: 8px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        header p {
            color: #7f8c8d;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        label {
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
            color: #34495e;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 16px;
            border: 2px solid #e0f2fe;
            border-radius: 12px;
            resize: none;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #f8fafc;
        }

        textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
            background-color: #ffffff;
        }

        button {
            width: 100%;
            padding: 16px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }

        button:hover {
            background-color: #0369a1;
        }

        button:active {
            transform: scale(0.99);
        }

        button:disabled {
            background-color: #bae6fd;
            cursor: not-allowed;
            box-shadow: none;
        }

        .result-container {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 2px dashed #e2e8f0;
            text-align: left;
            display: none;
        }

        .result-container.active {
            display: block;
        }

        .result-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0369a1;
            margin-bottom: 12px;
        }

        .result-content {
            background-color: #f0f9ff;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #bae6fd;
            line-height: 1.7;
            white-space: pre-line;
            font-size: 0.95rem;
            color: #1e293b;
        }

        .loading-spinner {
            display: none;
            margin: 20px auto;
            width: 36px;
            height: 36px;
            border: 4px solid #e0f2fe;
            border-top: 4px solid #0284c7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>AllA.M.</h1>
        <p>당신이 좋아하는 노래들로 취향을 분석하여 꼭 맞는 음악을 추천해드립니다.</p>
    </header>

    <main>
        <div class="input-group">
            <label for="songs-input">좋아하는 노래 제목과 아티스트를 입력해주세요</label>
            <textarea id="songs-input" placeholder="예시)&#10;1. 아이유 - 밤편지&#10;2. NewJeans - Ditto&#10;3. Day6 - 한 페이지가 될 수 있게"></textarea>
        </div>

        <button id="submit-btn" onclick="getRecommendations()">음악 취향 분석 & 추천받기</button>

        <div id="loading" class="loading-spinner"></div>

        <section id="result-section" class="result-container">
            <h2 class="result-title">🎵 AI 추천 결과</h2>
            <div id="result-content" class="result-content"></div>
        </section>
    </main>
</div>

<script>
    async function getRecommendations() {
        const input = document.getElementById('songs-input').value.trim();
        const submitBtn = document.getElementById('submit-btn');
        const loading = document.getElementById('loading');
        const resultSection = document.getElementById('result-section');
        const resultContent = document.getElementById('result-content');

        if (!input) {
            alert('좋아하는 노래를 입력해주세요.');
            return;
        }

        submitBtn.disabled = true;
        loading.style.display = 'block';
        resultSection.classList.remove('active');
        resultContent.textContent = '';

        try {
            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ songs: input })
            });

            const data = await response.json();

            if (response.ok) {
                resultContent.textContent = data.result;
                resultSection.classList.add('active');
            } else {
                alert(data.error || '음악 추천을 불러오는데 실패했습니다.');
            }
        } catch (error) {
            alert('서버와 통신 중 오류가 발생했습니다.');
        } finally {
            submitBtn.disabled = false;
            loading.style.display = 'none';
        }
    }
</script>

</body>
</html>
